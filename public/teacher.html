<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOFU | Teacher Dashboard</title>
    <script src="js/teacher.js" defer></script>

    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #f182d3;
            font-size: 40px;
            margin-bottom: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #0e0d0d;
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        p {
            color: #d35400;
            font-size: 15px;
            line-height: 1.6;
        }

        main {
            max-width: 700px;
            margin: 20px auto;
            padding: 15px;
        }

        .assignments {
            background-color: #f4f4f4;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .teacherinput {
            max-width: 450px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 18px;
            background-color: #f182d3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #d967b8;
        }

        .text-item {
            padding: 8px 12px;
            margin: 6px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow-wrap: anywhere;
            background-color: white;
        }

        #published-assignment {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #f182d3;
            border-radius: 8px;
            background-color: white;
            text-align: center;
        }

        #assignment-code {
            color: #f182d3;
            font-size: 30px;
            letter-spacing: 2px;
        }

        #status-message {
            text-align: center;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            align-items: center;
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin: 3px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Dashboard</h1>
        <p>Create and manage student assignments</p>
    </header>

    <main>
        <section class="assignments">
            <h2>Create Assignment</h2>

            <form id="assignment-form" class="teacherinput">
                <label for="title">Assignment Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Critical Thinking Practice"
                    required
                >

                <label for="instructions">Instructions</label>
                <textarea
                    id="instructions"
                    rows="3"
                    placeholder="Explain what students should do..."
                    required
                ></textarea>

                <label for="question">Assignment Question</label>
                <textarea
                    id="question"
                    rows="4"
                    placeholder="Enter the question students will answer..."
                    required
                ></textarea>

                <button type="submit" id="publishBtn">
                    Publish Assignment
                </button>
            </form>

            <p id="status-message" role="status"></p>

            <section id="published-assignment" hidden>
                <h2>Assignment Published!</h2>
                <p>Share this code with your students:</p>
                <h3 id="assignment-code"></h3>
                <p id="published-title"></p>
            </section>

            <section id="assignment-list">
                <h2>Published Assignments</h2>
                <div id="assignmentblock">
                    <p>No assignments published yet.</p>
                </div>
            </section>
        </section>

        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="homepage.html">Back</a></li>
            </ul>
        </nav>
    </main>
</body>
</html>
