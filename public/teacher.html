<html>
  <head>
    <title>Teacher</title>
    <script src="js/teacher.js" defer></script>
  </head>
  <body>
    <header>
      <style>
        body {
          background-color: #f0f0f0;
          font-family: Arial, sans-serif;
        }
        h1 {
          color: #f182d3;
          font-size: 40px;
          margin-bottom: 2px;
          text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        h2 {
          color: #0e0d0d;
          font-size: 20px;
          margin-bottom: 2px;
          text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
          text-align: center;
        }
        p {
          color: #d35400;
          font-size: 15px;
          line-height: 1.6;
        }
        img {
          margin: 15;
        }

        .nav-links {
          display: flex;
          justify-content: center;
          align-items: center;
          list-style: none;
        }

        .nav-links li {
          margin: 3;
        }

        #assignmentblock {
          display: block;
          width: 400px;
          height: 400px;
          margin: 20px auto; /* Centers the block horizontally */
          padding: 15px;
          background-color: #f4f4f4;
          overflow-y: auto;
        }
        .text-item {
          padding: 8px 12px;
          margin: 6px 0;
          border: 1px solid #ddd;
          border-radius: 4px;
          word-wrap: break-word;
        }
        .controls {
          display: flex;
          gap: 8px;
          width: 350px;
        }
        input {
          flex: 1;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 4px;
        }
      </style>
      <h1>Dashboard</h1>
    </header>

    <main>
      <div class="assignments">
        <h2>Assignments</h2>
        <div id="assignmentblock"></div>
      </div>
      <div class="teacherinput">
        <input
          type="text"
          id="textInput"
          placeholder="Type a prompt"
          autocomplete="off"
        />
        <button id="addBtn">Submit</button>
      </div>
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="homepage.html">Back</a></li>
        </ul>
      </nav>
    </main>
    <footer></footer>
  </body>
</html>
